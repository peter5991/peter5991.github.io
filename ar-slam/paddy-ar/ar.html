<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水稻田微缩场景 D4·AR</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  html { background: #20242c; }
  /* body 必须透明:MindAR 的 <video> 是 body 下 z-index:-2 的子元素,body 自带不透明背景会把它整个盖住(摄像头黑屏、透明 WebGL 画布上的模型却照常显示) */
  body { background: transparent; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b8bcc8; font: 14px/1.6 "Hiragino Sans", "Noto Sans JP", sans-serif;
    letter-spacing: 0.2em; pointer-events: none;
    /* 必须高于 #veil(45):入口链接恒带 ?v=,veil 在 ready 前一直盖全屏,加载提示被盖住=黑屏无任何线索 */
    z-index: 46; text-align: center; padding: 0 2em;
  }
  #err {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99;
    background: #c0392b; color: #fff; padding: 10px 14px;
    font: 13px/1.5 monospace; white-space: pre-wrap; word-break: break-all;
    display: none;
  }
  html[data-error="1"] #err { display: block; }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #20242c; color: #b8bcc8; text-align: center;
    font: 15px/1.8 "Hiragino Sans", "Noto Sans JP", sans-serif; padding: 2em; z-index: 50;
  }
  html[data-webgl="0"] #fallback { display: flex; }
  html[data-webgl="0"] #loading { display: none; }
  /* D4:debug 角标(手机联调替代 console,M3 D5) */
  #dbg {
    position: fixed; left: 10px; bottom: 10px; z-index: 30;
    background: rgba(20, 22, 28, 0.6); color: #cfd4de; padding: 4px 10px; border-radius: 6px;
    font: 11px/1.5 monospace; pointer-events: none; white-space: nowrap;
  }
  /* D2 四季×昼夜切换 UI + D3 动效开关(与 index.html 同款,零库纯内联) */
  #switcher {
    position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column;
    gap: 8px; align-items: flex-end; z-index: 40;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #switcher .row {
    display: flex; gap: 2px; background: rgba(24, 26, 34, 0.66);
    border-radius: 999px; padding: 3px; box-shadow: 0 1px 6px rgba(30, 28, 24, 0.18);
  }
  #switcher button {
    border: 0; background: transparent; padding: 5px 13px; border-radius: 999px;
    font-size: 12px; letter-spacing: 2px; color: #b8bcc8; cursor: pointer;
  }
  #switcher button.on { background: #4e4438; color: #f2efe6; }
  #veil {
    position: fixed; inset: 0; background: #20242c; opacity: 0;
    pointer-events: none; transition: opacity 180ms ease; z-index: 45;
  }
</style>
<script>
  (function () {
    function report(msg) {
      var el = document.getElementById('err');
      if (el) el.textContent += (el.textContent ? '\n' : '') + msg;
      document.documentElement.dataset.error = '1';
    }
    window.addEventListener('error', function (e) {
      report((e.message || 'Script error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      report('Unhandled rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
    });
    window.__reportErr = report;
  })();
</script>
<script type="importmap">
  {
    "imports": {
      "three": "./vendor/three-shim.mjs",
      "three/addons/renderers/CSS3DRenderer.js": "./vendor/CSS3DRenderer.js"
    }
  }
</script>
</head>
<body>
<div id="loading">AR 初始化中 …</div>
<div id="err"></div>
<div id="fallback">
  <div>
    <p><strong>当前浏览器无法创建 WebGL 环境,AR 场景无法运行。</strong></p>
    <p>请改用 Android 系统 Chrome 最新版本,在光线充足处扫描图卡。<br>
    图卡文件:assets/paddy-card.png(A5 打印)。</p>
  </div>
</div>
<div id="dbg">初始化…</div>
<div id="switcher">
  <div class="row" id="seasonRow">
    <button data-season="spring">春</button><button data-season="summer">夏</button>
    <button data-season="autumn">秋</button><button data-season="winter">冬</button>
  </div>
  <div class="row" id="timeRow">
    <button data-time="day">昼</button><button data-time="night">夜</button>
  </div>
  <div class="row" id="animRow">
    <button data-anim="on">动</button><button data-anim="off">静</button>
  </div>
</div>
<div id="veil"></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var season = q.get('season') || 'spring';
    var time = q.get('time') || 'day';
    if (!/^(spring|summer|autumn|winter)$/.test(season)) season = 'spring';
    if (!/^(day|night)$/.test(time)) time = 'day';
    var anim = (q.get('anim') === 'off' && q.get('t') === null) ? 'off' : 'on';
    var sw = document.getElementById('switcher');
    var veil = document.getElementById('veil');
    var btns = sw.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if ((b.dataset.season && b.dataset.season === season) ||
          (b.dataset.time && b.dataset.time === time) ||
          (b.dataset.anim && b.dataset.anim === anim)) b.classList.add('on');
    }
    sw.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.anim) {
        var na = b.dataset.anim;
        if (na === anim) return;
        anim = na;
        if (window.paddy && window.paddy.setAnim) window.paddy.setAnim(na === 'on');
        var ab = document.querySelectorAll('#animRow button');
        for (var j = 0; j < ab.length; j++) ab[j].classList.toggle('on', ab[j].dataset.anim === na);
        var q2 = new URLSearchParams(location.search);
        if (na === 'off') q2.set('anim', 'off'); else q2.delete('anim');
        q2.delete('t');
        var qs2 = q2.toString();
        history.replaceState(null, '', location.pathname + (qs2 ? '?' + qs2 : ''));
        return;
      }
      var ns = b.dataset.season || season;
      var nt = b.dataset.time || time;
      if (ns === season && nt === time) return;
      veil.style.opacity = '1';
      veil.addEventListener('transitionend', function () {
        location.search = '?season=' + ns + '&time=' + nt + (anim === 'off' ? '&anim=off' : '');
      }, { once: true });
    });
    if (location.search) {
      veil.style.opacity = '1';
      var mo = new MutationObserver(function () {
        if (document.documentElement.dataset.ready === '1') {
          veil.style.opacity = '0';
          mo.disconnect();
        }
      });
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-ready'] });
    }
  })();
</script>
<script type="module" src="./src/ar.js?v=20261008144729"></script>
</body>
</html>
