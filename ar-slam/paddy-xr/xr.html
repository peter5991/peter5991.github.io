<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水稻田微缩场景 D5·WebXR</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #20242c; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b8bcc8; font: 14px/1.6 "Hiragino Sans", "Noto Sans JP", sans-serif;
    letter-spacing: 0.2em; pointer-events: none;
  }
  #err {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99;
    background: #c0392b; color: #fff; padding: 10px 14px;
    font: 13px/1.5 monospace; white-space: pre-wrap; word-break: break-all;
    display: none;
  }
  html[data-error="1"] #err { display: block; }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #20242c; color: #b8bcc8; text-align: center;
    font: 15px/1.8 "Hiragino Sans", "Noto Sans JP", sans-serif; padding: 2em; z-index: 50;
  }
  html[data-webgl="0"] #fallback, html[data-noxr="1"] #fallback { display: flex; }
  html[data-webgl="0"] #loading, html[data-noxr="1"] #loading,
  html[data-webgl="0"] #enterwrap, html[data-noxr="1"] #enterwrap { display: none; }
  /* D5:进入 AR 按钮(WebXR 必须用户手势触发) */
  #enterwrap {
    position: fixed; left: 0; right: 0; bottom: 88px; z-index: 40;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #btn-enter {
    border: 0; background: #4e4438; color: #f2efe6; cursor: pointer;
    padding: 14px 44px; border-radius: 999px; font-size: 17px; letter-spacing: 4px;
    box-shadow: 0 2px 10px rgba(30, 28, 24, 0.35);
  }
  #btn-enter:disabled { opacity: 0.5; cursor: default; }
  #hint { color: #8a8f9c; font-size: 12px; letter-spacing: 1px; text-align: center; padding: 0 2em; }
  /* D5 迭代①:调试日志面板(真机排障——折叠态一行,点标题展开,复制按钮) */
  #logwrap {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    background: rgba(10, 12, 16, 0.85); color: #cfd4de; font: 11px/1.5 monospace;
  }
  #loghead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; cursor: pointer; }
  #btn-copy { border: 1px solid #555; background: transparent; color: #cfd4de; border-radius: 6px; padding: 2px 10px; font: 11px monospace; cursor: pointer; }
  #log { display: none; max-height: 36vh; overflow-y: auto; padding: 0 10px 8px; white-space: pre-wrap; word-break: break-all; }
  #logwrap.open #log { display: block; }
  html[data-error="1"] #logwrap { top: 44px; } /* 错误条占位,避免盖住面板头 */
  /* debug 角标(手机联调替代 console,M3 D5) */
  #dbg {
    position: fixed; left: 10px; bottom: 10px; z-index: 30;
    background: rgba(20, 22, 28, 0.6); color: #cfd4de; padding: 4px 10px; border-radius: 6px;
    font: 11px/1.5 monospace; pointer-events: none; white-space: nowrap;
  }
  /* 四季×昼夜切换 UI + 动效开关(与 index.html/ar.html 同款,零库纯内联) */
  #switcher {
    position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column;
    gap: 8px; align-items: flex-end; z-index: 40;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #switcher .row {
    display: flex; gap: 2px; background: rgba(24, 26, 34, 0.66);
    border-radius: 999px; padding: 3px; box-shadow: 0 1px 6px rgba(30, 28, 24, 0.18);
  }
  #switcher button {
    border: 0; background: transparent; padding: 5px 13px; border-radius: 999px;
    font-size: 12px; letter-spacing: 2px; color: #b8bcc8; cursor: pointer;
  }
  #switcher button.on { background: #4e4438; color: #f2efe6; }
  #veil {
    position: fixed; inset: 0; background: #20242c; opacity: 0;
    pointer-events: none; transition: opacity 180ms ease; z-index: 45;
  }
</style>
<script>
  (function () {
    function report(msg) {
      var el = document.getElementById('err');
      if (el) el.textContent += (el.textContent ? '\n' : '') + msg;
      document.documentElement.dataset.error = '1';
    }
    window.addEventListener('error', function (e) {
      report((e.message || 'Script error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      report('Unhandled rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
    });
    // D5 迭代②:资源加载失败(模块 404 等)不冒泡,必须捕获阶段监听——否则整个模块图静默不执行
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && (t.src || t.href)) {
        var url = t.src || t.href;
        report('资源加载失败: ' + url);
        window.__dbgLog && window.__dbgLog('资源加载失败: ' + url);
      }
    }, true);
    window.__reportErr = report;
    // D5 迭代①:调试日志(真机排障——每步初始化打点,卡点一目了然)
    window.__dbgLog = function (msg) {
      var el = document.getElementById('log');
      if (!el) return;
      el.textContent += '[' + (performance.now() / 1000).toFixed(1) + 's] ' + msg + '\n';
      el.scrollTop = el.scrollHeight;
    };
  })();
</script>
</head>
<body>
<div id="loading">WebXR 初始化中 …</div>
<div id="err"></div>
<div id="fallback">
  <div>
    <p><strong>当前设备/浏览器不支持 WebXR AR,或无法创建 WebGL 环境。</strong></p>
    <p>请改用支持 ARCore 的 Android 手机 + 系统 Chrome 最新版本打开。<br>
    图卡保底版:ar.html(MindAR,无需 WebXR)。</p>
  </div>
</div>
<div id="enterwrap">
  <button id="btn-enter" disabled>进入 AR</button>
  <div id="hint">进入后:镜头对准桌面/地面<b>缓慢移动扫描约 20 秒</b>,绿圈出现后点屏幕放置;<br>长时间找不到平面会自动放镜头前方;放置后走开 2~3 米回看,再点"复制"日志</div>
</div>
<div id="dbg">初始化…</div>
<div id="logwrap">
  <div id="loghead"><span>🪵 调试日志(点击展开)</span><button id="btn-copy" type="button">复制</button></div>
  <div id="log"></div>
</div>
<div id="switcher">
  <div class="row" id="seasonRow">
    <button data-season="spring">春</button><button data-season="summer">夏</button>
    <button data-season="autumn">秋</button><button data-season="winter">冬</button>
  </div>
  <div class="row" id="timeRow">
    <button data-time="day">昼</button><button data-time="night">夜</button>
  </div>
  <div class="row" id="animRow">
    <button data-anim="on">动</button><button data-anim="off">静</button>
  </div>
</div>
<div id="veil"></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var season = q.get('season') || 'spring';
    var time = q.get('time') || 'day';
    if (!/^(spring|summer|autumn|winter)$/.test(season)) season = 'spring';
    if (!/^(day|night)$/.test(time)) time = 'day';
    var anim = (q.get('anim') === 'off' && q.get('t') === null) ? 'off' : 'on';
    var sw = document.getElementById('switcher');
    var veil = document.getElementById('veil');
    var btns = sw.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if ((b.dataset.season && b.dataset.season === season) ||
          (b.dataset.time && b.dataset.time === time) ||
          (b.dataset.anim && b.dataset.anim === anim)) b.classList.add('on');
    }
    sw.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.anim) {
        var na = b.dataset.anim;
        if (na === anim) return;
        anim = na;
        if (window.paddy && window.paddy.setAnim) window.paddy.setAnim(na === 'on');
        var ab = document.querySelectorAll('#animRow button');
        for (var j = 0; j < ab.length; j++) ab[j].classList.toggle('on', ab[j].dataset.anim === na);
        var q2 = new URLSearchParams(location.search);
        if (na === 'off') q2.set('anim', 'off'); else q2.delete('anim');
        q2.delete('t');
        var qs2 = q2.toString();
        history.replaceState(null, '', location.pathname + (qs2 ? '?' + qs2 : ''));
        return;
      }
      var ns = b.dataset.season || season;
      var nt = b.dataset.time || time;
      if (ns === season && nt === time) return;
      veil.style.opacity = '1';
      veil.addEventListener('transitionend', function () {
        location.search = '?season=' + ns + '&time=' + nt + (anim === 'off' ? '&anim=off' : '');
      }, { once: true });
    });
    if (location.search) {
      veil.style.opacity = '1';
      var mo = new MutationObserver(function () {
        if (document.documentElement.dataset.ready === '1') {
          veil.style.opacity = '0';
          mo.disconnect();
        }
      });
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-ready'] });
    }

    // D5 迭代①:日志面板交互——点标题展开/收起;复制(clipboard API + execCommand 兜底);15s 未就绪自动展开
    var logwrap = document.getElementById('logwrap');
    var btnCopy = document.getElementById('btn-copy');
    document.getElementById('loghead').addEventListener('click', function () {
      logwrap.classList.toggle('open');
    });
    btnCopy.addEventListener('click', function (e) {
      e.stopPropagation();
      var text = (document.getElementById('log').textContent || '(日志为空)') +
        '\nUA: ' + navigator.userAgent;
      function ok() { btnCopy.textContent = '已复制'; setTimeout(function () { btnCopy.textContent = '复制'; }, 1500); }
      function legacy() {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); } catch (err) { btnCopy.textContent = '复制失败'; }
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, legacy);
      } else legacy();
    });
    setTimeout(function () {
      if (document.documentElement.dataset.ready !== '1') {
        logwrap.classList.add('open');
        window.__dbgLog('⚠ 15s 仍未就绪——上面最后一行日志即卡点,请点"复制"发回');
      }
    }, 15000);
  })();
</script>
<script type="module" src="./src/xr.js?v=20261008093700"></script>
</body>
</html>
