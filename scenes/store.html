<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨夜便利店 · 微缩场景</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0e1a; }
  canvas { display:block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= Renderer / Scene / Camera ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1226);
scene.fog = new THREE.Fog(0x0d1226, 42, 95);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(16, 12, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ================= Toon gradient map ================= */
const gradData = new Uint8Array([70,70,70,255, 150,150,150,255, 220,220,220,255, 255,255,255,255]);
const gradMap = new THREE.DataTexture(gradData, 4, 1, THREE.RGBAFormat);
gradMap.needsUpdate = true;
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;

function toon(color, opts = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradMap }, opts));
}

/* Inverted-hull outline helper */
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x191423, side: THREE.BackSide });
function outline(mesh, scale = 1.045) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.scale.setScalar(scale);
  mesh.add(o);
  return o;
}

/* Quick mesh helpers */
function M(geo, mat, x=0, y=0, z=0, oScale=0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (oScale) outline(m, oScale);
  return m;
}
function B(w,h,d) { return new THREE.BoxGeometry(w,h,d); }
function C(rt,rb,h,seg=16) { return new THREE.CylinderGeometry(rt,rb,h,seg); }

/* ================= Canvas texture helpers ================= */
function textTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* big store sign texture */
const signTex = textTex(1024, 128, (g, w, h) => {
  g.fillStyle = '#fffbef'; g.fillRect(0, 0, w, h);
  /* green/orange edge stripes */
  g.fillStyle = '#1e8a5a'; g.fillRect(0, 0, 26, h); g.fillRect(w-26, 0, 26, h);
  g.fillStyle = '#f08a28'; g.fillRect(26, 0, 20, h); g.fillRect(w-46, 0, 20, h);
  /* star logo */
  g.fillStyle = '#f0a832';
  g.save(); g.translate(110, h/2);
  g.beginPath();
  for (let i = 0; i < 8; i++) {
    const r = i % 2 ? 12 : 34, a = Math.PI/4 * i - Math.PI/2;
    g[i ? 'lineTo' : 'moveTo'](Math.cos(a)*r, Math.sin(a)*r);
  }
  g.closePath(); g.fill(); g.restore();
  g.font = 'bold 58px "Hiragino Sans", "Noto Sans JP", sans-serif';
  g.fillStyle = '#4a5468'; g.textBaseline = 'middle';
  g.fillText('ひかりマート', 190, h/2 + 4);
  g.font = 'bold 30px "Hiragino Sans", "Noto Sans JP", sans-serif';
  g.fillStyle = '#8a93a5';
  g.fillText('HIKARI MART 24h', 640, h/2 + 6);
});
/* vertical banner texture */
const bannerTex = textTex(128, 512, (g, w, h) => {
  g.fillStyle = '#fff2d8'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#d84a4a'; g.fillRect(0, 0, w, 56);
  g.fillStyle = '#fff2d8'; g.font = 'bold 34px "Hiragino Sans", sans-serif';
  g.textAlign = 'center';
  g.fillText('OPEN', w/2, 40);
  g.fillStyle = '#27303f'; g.font = 'bold 62px "Hiragino Sans", sans-serif';
  const chars = ['2','4','時','間'];
  chars.forEach((ch, i) => g.fillText(ch, w/2, 130 + i*86));
});
/* poster textures */
function posterTex(bg, band, title) {
  return textTex(128, 176, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = band; g.fillRect(0, 0, w, 46);
    g.fillStyle = '#ffffff'; g.font = 'bold 26px "Hiragino Sans", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(title, w/2, 24);
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.beginPath(); g.arc(w/2, 110, 38, 0, Math.PI*2); g.fill();
    g.fillStyle = band;
    g.beginPath(); g.arc(w/2-12, 102, 10, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(w/2+12, 102, 10, 0, Math.PI*2); g.fill();
    g.fillRect(w/2-16, 118, 32, 8);
    g.fillStyle = band; g.fillRect(14, h-16, w-28, 6);
  });
}
/* floor tile texture */
const tileTex = textTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d6dae2'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#b8bec9'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(i*64, 0); g.lineTo(i*64, h); g.stroke();
    g.beginPath(); g.moveTo(0, i*64); g.lineTo(w, i*64); g.stroke();
  }
});
tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
tileTex.repeat.set(5, 3);
/* light box sign textures */
function lightboxTex(txt) {
  return textTex(256, 64, (g, w, h) => {
    g.fillStyle = '#fff8e8'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#c8452a'; g.font = 'bold 34px "Hiragino Sans", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(txt, w/2, h/2);
  });
}

/* ================= Lights ================= */
scene.add(new THREE.AmbientLight(0x33406b, 1.5));
const hemi = new THREE.HemisphereLight(0x27345c, 0x0e1322, 0.9);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa4d8, 0.75);
moon.position.set(-18, 26, -10);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = moon.shadow.camera.bottom = -22;
moon.shadow.camera.right = moon.shadow.camera.top = 22;
scene.add(moon);

const innerLight = new THREE.PointLight(0xffd9a0, 62, 15, 1.8);
innerLight.position.set(1.5, 2.6, -3.4);
scene.add(innerLight);
const innerLight2 = new THREE.PointLight(0xfff0d0, 26, 9, 1.8);
innerLight2.position.set(1.5, 2.6, -7.4);
scene.add(innerLight2);
const lampLight = new THREE.PointLight(0xffc27a, 42, 14, 1.8);
lampLight.position.set(-6.2, 4.6, 2.4);
lampLight.castShadow = true;
scene.add(lampLight);
const signLight = new THREE.PointLight(0xffe9c4, 18, 9, 2);
signLight.position.set(1.5, 3.2, -2.2);
scene.add(signLight);

/* ================= Ground base (square pedestal) ================= */
const BASE = 24;
const base = M(B(BASE, 1.2, BASE), toon(0x1c2233), 0, -0.6, 0, 1.02);
base.receiveShadow = true;
scene.add(base);
const rim = M(B(BASE+0.6, 0.35, BASE+0.6), toon(0x141a29), 0, -1.05, 0, 1.015);
scene.add(rim);
/* pedestal name plate */
const plateTex = textTex(256, 48, (g, w, h) => {
  g.fillStyle = '#1a2033'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#8a744a'; g.lineWidth = 3; g.strokeRect(4, 4, w-8, h-8);
  g.fillStyle = '#d8b96a'; g.font = 'bold 22px "Hiragino Sans", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('雨夜の街角 · 1/150', w/2, h/2);
});
const plate = new THREE.Mesh(B(3.2, 0.6, 0.08), new THREE.MeshToonMaterial({ map: plateTex, gradientMap: gradMap }));
plate.position.set(0, -0.55, 12.28);
scene.add(plate);

/* ---------------- Streets (corner L-shape) ---------------- */
const roadMat = new THREE.MeshStandardMaterial({ color:0x232838, roughness:0.22, metalness:0.6 });
const road1 = M(B(BASE, 0.06, 7), roadMat, 0, 0.03, 3.5);
const road2 = M(B(7, 0.06, BASE-7), roadMat, -7.5, 0.03, -3.5);
road1.receiveShadow = road2.receiveShadow = true;
scene.add(road1, road2);

/* road markings: dashed center line + stop lines */
const markMat = new THREE.MeshBasicMaterial({ color:0xd8c86a });
for (let i = 0; i < 5; i++) scene.add(M(B(1.2, 0.015, 0.12), markMat, 1.5 + i*2.4, 0.075, 3.5));
for (let i = 0; i < 4; i++) scene.add(M(B(0.12, 0.015, 1.2), markMat, -7.5, 0.075, -10.5 + i*2.4));
const stopMat = new THREE.MeshBasicMaterial({ color:0xe8ecf2 });
scene.add(M(B(2.8, 0.015, 0.35), stopMat, -3.4, 0.075, 3.5));
scene.add(M(B(0.35, 0.015, 2.8), stopMat, -7.5, 0.075, -1.2));
/* manhole covers */
[[-1, 4.4], [-8.2, -4.8]].forEach(([x, z]) => {
  const mh = M(C(0.42, 0.42, 0.02, 20), toon(0x30363f), x, 0.07, z);
  scene.add(mh);
  scene.add(M(B(0.5, 0.01, 0.06), toon(0x232a33), x, 0.085, z));
});

/* sidewalk */
const walkMat = new THREE.MeshStandardMaterial({ color:0x3a4154, roughness:0.45, metalness:0.25 });
const sidewalk = M(B(15, 0.14, 9), walkMat, 3, 0.07, -3);
sidewalk.receiveShadow = true;
const sidewalk2 = M(B(3.4, 0.14, 13), walkMat, -5.7, 0.07, -3);
sidewalk2.receiveShadow = true;
scene.add(sidewalk, sidewalk2);

/* tactile paving (yellow dot strip) */
const tactMat = toon(0xd8b93a);
scene.add(M(B(13, 0.02, 0.4), tactMat, 2.6, 0.15, 0.4));
for (let i = 0; i < 22; i++) {
  const d = M(C(0.045, 0.045, 0.015, 8), toon(0xc8a92e), -3.6 + i*0.6, 0.165, 0.4);
  scene.add(d);
}

/* curb */
const curbMat = toon(0x4a5266);
scene.add(M(B(15, 0.1, 0.3), curbMat, 3, 0.1, 1.35));
scene.add(M(B(0.3, 0.1, 13), curbMat, -4.1, 0.1, -3));

/* crosswalk stripes */
const zebraMat = new THREE.MeshStandardMaterial({ color:0xdfe4ee, roughness:0.18, metalness:0.45, emissive:0x2a3040, emissiveIntensity:0.4 });
for (let i = 0; i < 6; i++) scene.add(M(B(0.55, 0.02, 3.2), zebraMat, -8.2 + i*1.05, 0.07, 3.5));
for (let i = 0; i < 5; i++) scene.add(M(B(3.2, 0.02, 0.55), zebraMat, -7.5, 0.07, 0.6 + i*1.05));

/* drainage gutter */
scene.add(M(B(15, 0.05, 0.32), toon(0x151a26), 3, 0.045, 1.7));
for (let i = 0; i < 6; i++) scene.add(M(B(0.9, 0.02, 0.24), toon(0x2a3242), -3.2+i*2.5, 0.075, 1.7));

/* parking spots */
const parkLine = new THREE.MeshBasicMaterial({ color:0x8f97ab });
for (let i = 0; i < 3; i++) {
  const x = 5.6 + i*1.9;
  scene.add(M(B(0.08, 0.015, 2.6), parkLine, x-0.95, 0.075, -0.2));
  if (i === 2) scene.add(M(B(0.08, 0.015, 2.6), parkLine, x+0.95, 0.075, -0.2));
}
scene.add(M(B(5.6, 0.015, 0.08), parkLine, 7.5, 0.075, -1.5));
/* wheel stops */
for (let i = 0; i < 3; i++) scene.add(M(B(1.4, 0.12, 0.15), toon(0x5a6270), 5.6+i*1.9, 0.14, -1.3));

/* puddles: organic blob shapes, warm reflection tint near store lights */
const puddleMat = new THREE.MeshStandardMaterial({ color:0x101828, roughness:0.05, metalness:0.92, transparent:true, opacity:0.88 });
const puddleWarmMat = new THREE.MeshStandardMaterial({ color:0x2a2216, roughness:0.06, metalness:0.85, transparent:true, opacity:0.9, emissive:0xff9a40, emissiveIntensity:0.22 });
const puddles = [];
function blobGeo(seed) {
  const pts = [];
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = Math.PI*2 * i/n;
    const r = 0.7 + Math.abs(Math.sin(seed + i*2.7)) * 0.45;
    pts.push(new THREE.Vector2(Math.cos(a)*r, Math.sin(a)*r));
  }
  return new THREE.ShapeGeometry(new THREE.Shape(pts), 4);
}
[[-2, 3.2, 2.2, 1.3, false], [3.5, 4.8, 1.6, 1.0, false], [-7.4, -0.5, 1.4, 1.8, false],
 [7.8, 2.6, 1.9, 1.1, false], [0.5, 5.6, 2.6, 1.2, false], [-5.5, 0.5, 1.0, 0.8, false],
 [1.8, 0.6, 1.5, 0.7, true], [4.6, 0.3, 1.2, 0.6, true], [-1.4, 0.5, 1.1, 0.55, true]].forEach((p, idx) => {
  const pd = new THREE.Mesh(blobGeo(idx*3.7), p[4] ? puddleWarmMat : puddleMat);
  pd.rotation.x = -Math.PI/2;
  pd.scale.set(p[2], p[3], 1);
  pd.position.set(p[0], 0.068 + (p[4]?0.085:0), p[1]);
  scene.add(pd);
  puddles.push(pd);
});
/* warm light spill on sidewalk in front of store */
const spillTex = textTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w/2, h/2, 8, w/2, h/2, 64);
  gr.addColorStop(0, 'rgba(255,190,110,0.55)');
  gr.addColorStop(1, 'rgba(255,190,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const spill = new THREE.Mesh(new THREE.PlaneGeometry(11, 4.5),
  new THREE.MeshBasicMaterial({ map: spillTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
spill.rotation.x = -Math.PI/2;
spill.position.set(1.5, 0.15, -1.6);
scene.add(spill);

/* ================= Convenience store building ================= */
const store = new THREE.Group();
store.position.set(1.5, 0, -5.6);
scene.add(store);

const wallMat = toon(0xe8e2d6);
const darkWallMat = toon(0xb9b0a2);
const SW = 10, SD = 5.4, SH = 3.2;

/* interior floor (tiled) */
const floorIn = M(B(SW, 0.12, SD), new THREE.MeshToonMaterial({ map: tileTex, gradientMap: gradMap }), 0, 0.16, 0);
floorIn.receiveShadow = true;
store.add(floorIn);

/* walls + roof */
const backW = M(B(SW, SH, 0.25), darkWallMat, 0, SH/2+0.1, -SD/2+0.12, 1.02);
const leftW = M(B(0.25, SH, SD), wallMat, -SW/2+0.12, SH/2+0.1, 0, 1.02);
const rightW = M(B(0.25, SH, SD), wallMat, SW/2-0.12, SH/2+0.1, 0, 1.02);
[backW, leftW, rightW].forEach(w => { w.castShadow = w.receiveShadow = true; store.add(w); });
const roof = M(B(SW+0.5, 0.35, SD+0.5), toon(0x3d4356), 0, SH+0.28, 0, 1.025);
roof.castShadow = true;
store.add(roof);

/* roof equipment: condenser, vent pipes, railing */
const roofAC = M(B(1.2, 0.7, 0.6), toon(0x8a93a2), -2.6, SH+0.8, -0.8, 1.05);
roofAC.castShadow = true;
store.add(roofAC);
store.add(M(C(0.07, 0.07, 0.9, 10), toon(0x9aa2b0), 2.4, SH+0.85, -1.2));
store.add(M(C(0.14, 0.14, 0.08, 10), toon(0x9aa2b0), 2.4, SH+1.32, -1.2));
store.add(M(C(0.05, 0.05, 0.7, 8), toon(0x9aa2b0), 3.2, SH+0.75, 0.5));
/* parapet trim band */
store.add(M(B(SW+0.55, 0.12, SD+0.55), toon(0x2e3444), 0, SH+0.48, 0));

const glassMat = new THREE.MeshPhysicalMaterial({ color:0xbfe0ff, transparent:true, opacity:0.12, roughness:0.05, metalness:0.1, side:THREE.DoubleSide });
const frameMat = toon(0x4a505e);
const frontZ = SD/2 - 0.1;

/* top facade band */
const facade = M(B(SW, 0.85, 0.3), toon(0xf2ede2), 0, SH-0.33, frontZ, 1.02);
facade.castShadow = true;
store.add(facade);

/* glass panes */
const glassW = (SW - 2.6 - 0.6) / 2;
const paneXs = [-(2.6/2 + glassW/2 + 0.15), (2.6/2 + glassW/2 + 0.15)];
paneXs.forEach(x => {
  const g = new THREE.Mesh(B(glassW, SH-1.15, 0.06), glassMat);
  g.position.set(x, (SH-1.15)/2 + 0.12, frontZ);
  store.add(g);
  store.add(M(B(glassW+0.12, 0.08, 0.12), frameMat, x, 0.16, frontZ));
  store.add(M(B(glassW+0.12, 0.08, 0.12), frameMat, x, SH-0.78, frontZ));
  store.add(M(B(0.09, SH-1.15, 0.1), frameMat, x-glassW/2, (SH-1.15)/2+0.12, frontZ));
  store.add(M(B(0.09, SH-1.15, 0.1), frameMat, x+glassW/2, (SH-1.15)/2+0.12, frontZ));
  /* window decal stripes */
  const decal = new THREE.Mesh(B(glassW-0.3, 0.3, 0.01),
    new THREE.MeshBasicMaterial({ color:0xfff2cc, transparent:true, opacity:0.5 }));
  decal.position.set(x, 1.0, frontZ+0.045);
  store.add(decal);
});

/* sliding automatic doors */
const doorMat = new THREE.MeshPhysicalMaterial({ color:0xaad4f5, transparent:true, opacity:0.2, roughness:0.08 });
const doorFrameMat = toon(0x39404e);
const doors = [];
[-1, 1].forEach(s => {
  const d = new THREE.Group();
  d.add(new THREE.Mesh(B(1.28, SH-1.15, 0.05), doorMat));
  d.add(M(B(1.34, 0.09, 0.09), doorFrameMat, 0, (SH-1.15)/2-0.02, 0));
  d.add(M(B(1.34, 0.09, 0.09), doorFrameMat, 0, -(SH-1.15)/2+0.02, 0));
  d.add(M(B(0.09, SH-1.15, 0.09), doorFrameMat, s*0.64, 0, 0));
  d.add(M(B(0.09, SH-1.15, 0.09), doorFrameMat, -s*0.64, 0, 0));
  /* safety stripe sticker */
  const st = new THREE.Mesh(B(0.9, 0.14, 0.01), new THREE.MeshBasicMaterial({ color:0xfff2cc, transparent:true, opacity:0.6 }));
  st.position.y = 0.15;
  d.add(st);
  d.position.set(s*0.65, (SH-1.15)/2+0.12, frontZ);
  store.add(d);
  doors.push({ g: d, s, base: s*0.65 });
});
store.add(M(B(2.8, 0.5, 0.25), toon(0xf2ede2), 0, SH-0.58, frontZ));

/* glowing header sign (textured) */
const signMat = new THREE.MeshStandardMaterial({ map: signTex, emissive:0xffffff, emissiveMap: signTex, emissiveIntensity:1.35, roughness:0.4 });
const headerSign = M(B(SW-0.4, 0.62, 0.12), signMat, 0, SH-0.33, frontZ+0.16);
store.add(headerSign);
/* orange fascia band below sign (like reference) */
const fasciaBand = new THREE.Mesh(B(SW-0.2, 0.14, 0.06),
  new THREE.MeshStandardMaterial({ color:0xf08a28, emissive:0xf08a28, emissiveIntensity:0.9 }));
fasciaBand.position.set(0, SH-0.75, frontZ+0.14);
store.add(fasciaBand);

/* vertical banner sign (textured) */
const bannerMat = new THREE.MeshStandardMaterial({ map: bannerTex, emissive:0xffffff, emissiveMap: bannerTex, emissiveIntensity:1.1 });
const banner = new THREE.Group();
banner.position.set(SW/2 + 0.35, 2.2, frontZ - 0.3);
banner.add(M(B(0.55, 2.3, 0.12), bannerMat, 0, 0, 0, 1.05));
banner.add(M(B(0.08, 0.5, 0.08), frameMat, 0, 1.3, -0.15));
store.add(banner);
const bannerLight = new THREE.PointLight(0xffe2a8, 5, 4, 2);
bannerLight.position.set(6.9, 2.2, -2.6);
scene.add(bannerLight);

/* awning (deep green, like reference) */
const awnMat = toon(0x1e6a4e);
const awning = M(B(SW-0.6, 0.12, 1.3), awnMat, 0, SH-0.95, frontZ+0.7, 1.03);
awning.castShadow = true;
store.add(awning);
for (let i = 0; i < 8; i++) store.add(M(B(0.05, 0.14, 1.28), toon(0x155240), -SW/2+0.5+i*1.25, SH-0.95, frontZ+0.7));
/* awning scalloped edge */
for (let i = 0; i < 12; i++) {
  const sc = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.1, 12, 1, false, 0, Math.PI), awnMat);
  sc.rotation.z = Math.PI/2; sc.rotation.y = Math.PI/2;
  sc.position.set(-SW/2+0.55+i*0.78, SH-1.0, frontZ+1.32);
  store.add(sc);
}

/* shelf builder with price tags */
function shelf(w=1.8, h=1.5, d=0.5) {
  const g = new THREE.Group();
  const body = M(B(w, h, d), toon(0x8a93a5), 0, h/2, 0, 1.03);
  body.castShadow = true;
  g.add(body);
  const tagMat = new THREE.MeshBasicMaterial({ color:0xfff0c0 });
  const cols = [0xe85a5a, 0x5a8de8, 0xf0c040, 0x62c46f, 0xd07ae8, 0xf08a40, 0x4fd0c8];
  for (let i = 0; i < 4; i++) {
    g.add(M(B(w-0.06, 0.03, d-0.04), toon(0xd8dde6), 0, 0.35+i*0.36, 0));
    g.add(M(B(w-0.1, 0.05, 0.02), tagMat, 0, 0.35+i*0.36-0.04, d/2-0.01)); /* price rail */
    let x = -w/2 + 0.18;
    while (x < w/2 - 0.15) {
      const bw = 0.1 + Math.random()*0.1;
      const bh = 0.13 + Math.random()*0.17;
      g.add(M(B(bw, bh, 0.2), toon(cols[(Math.random()*cols.length)|0]), x, 0.35+i*0.36+bh/2+0.02, (Math.random()-0.5)*0.1));
      x += bw + 0.035;
    }
  }
  /* top sign */
  g.add(M(B(w*0.6, 0.14, 0.03), new THREE.MeshBasicMaterial({ color:0xf7e8b0 }), 0, h+0.1, 0));
  return g;
}

  for (let i = 0; i <= 16; i++) {
    const t = i/16;
    pts.push(new THREE.Vector3(
      x1 + (x2-x1)*t,
      y1 + (y2-y1)*t - Math.sin(Math.PI*t)*sag,
      z1 + (z2-z1)*t));

  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.022, 5, false), wireMat));
}

/* ================= Rain (slanted streaks) ================= */
const RAIN_N = 900;
const RAIN_LEN = 0.55;
const rainPos = new Float32Array(RAIN_N * 6);   // 2 verts per streak
const rainVel = new Float32Array(RAIN_N);
const WIND = 0.12;                               // horizontal slant factor
for (let i = 0; i < RAIN_N; i++) {
  const x = (Math.random()-0.5) * 34, y = Math.random() * 18, z = (Math.random()-0.5) * 34;
  rainPos[i*6]   = x; rainPos[i*6+1] = y; rainPos[i*6+2] = z;
  rainPos[i*6+3] = x + WIND*RAIN_LEN; rainPos[i*6+4] = y + RAIN_LEN; rainPos[i*6+5] = z;
  rainVel[i] = 14 + Math.random()*8;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({
  color: 0x8fa8d8, transparent: true, opacity: 0.38,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(rain);

/* ================= Ripples ================= */

}

/* ================= Animation ================= */
let doorT = 0, doorTimer = 2.5;
let flicker = 1, flickerTimer = 0;
let trafTimer = 0;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* rain streaks */
  const pos = rainGeo.attributes.position.array;
  for (let i = 0; i < RAIN_N; i++) {
    const dy = rainVel[i] * dt, dx = dy * WIND;
    pos[i*6]   += dx; pos[i*6+1] -= dy;
    pos[i*6+3] += dx; pos[i*6+4] -= dy;
    if (pos[i*6+1] < 0) {
      const x = (Math.random()-0.5) * 34, y = 16 + Math.random()*4, z = (Math.random()-0.5) * 34;
      pos[i*6]   = x; pos[i*6+1] = y; pos[i*6+2] = z;
      pos[i*6+3] = x + WIND*RAIN_LEN; pos[i*6+4] = y + RAIN_LEN; pos[i*6+5] = z;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;

  /* ripples */
  ripples.forEach(r => {
    r.userData.t += dt * 0.9;
    if (r.userData.t > 1) {
      r.userData.t = 0;
      const p = puddles[(Math.random()*puddles.length)|0];
      r.position.set(p.position.x + (Math.random()-0.5)*1.4, 0.075, p.position.z + (Math.random()-0.5)*1.0);
    }
    const k = r.userData.t;
    r.scale.setScalar(0.15 + k*1.3);
    r.material.opacity = 0.5 * (1 - k);
  });

  /* drips */
  drips.forEach(d => {
    d.userData.t += dt;
    const cyc = 1.2 + (d.userData.x % 1 + 1) % 1;
    const k = (d.userData.t % cyc) / cyc;
    if (k < 0.55) {
      d.visible = true;
      d.position.set(d.userData.x, 2.35 - k*k*4.4, d.userData.z);
    } else d.visible = false;
  });

  /* sign flicker */
  flickerTimer -= dt;
  if (flickerTimer <= 0) {
    flickerTimer = 0.08 + Math.random()*0.4;
    flicker = Math.random() < 0.12 ? 0.55 + Math.random()*0.3 : 1;
  }
  signMat.emissiveIntensity = 1.35 * flicker;
  bannerMat.emissiveIntensity = 1.1 * flicker;
  signLight.intensity = 18 * flicker;
  bannerLight.intensity = 5 * flicker;

  /* doors */
  doorTimer -= dt;
  if (doorTimer <= 0) { doorT = doorT > 0.5 ? 0 : 1; doorTimer = doorT ? 3.2 : 4.5; }
  doors.forEach(({ g, s, base }) => {
    const target = base + s * doorT * 1.05;
    g.position.x += (target - g.position.x) * Math.min(1, dt*4);
  });

  /* hanging flags sway */
  flags.forEach((f, i) => { f.rotation.x = Math.sin(t*1.6 + i*1.3) * 0.08; });

  /* glass streaks */
  sctx.clearRect(0, 0, 256, 256);
  sctx.strokeStyle = 'rgba(200,220,255,0.8)';
  sctx.lineWidth = 1.4;
  streaks.forEach(s => {
    s.y += s.v * dt;
    if (s.y > 270) { s.y = -20; s.x = Math.random()*256; }
    sctx.beginPath();
    sctx.moveTo(s.x, s.y);
    sctx.lineTo(s.x, s.y + s.len);
    sctx.stroke();
  });
  streakTex.needsUpdate = true;

  /* traffic light */
  trafTimer += dt;
  const phase = trafTimer % 9;
  tR.material.color.setHex(phase < 4 ? 0xff3a3a : 0x521818);
  tG.material.color.setHex(phase >= 4.6 && phase < 8.4 ? 0x3aff6a : 0x18522a);
  tY.material.color.setHex(phase >= 8.4 ? 0xffd23a : 0x524418);

  /* shimmer + breathing */
  puddleMat.roughness = 0.05 + Math.sin(t*2)*0.02;
  puddleWarmMat.emissiveIntensity = 0.22 + Math.sin(t*2.4)*0.06;
  spill.material.opacity = 0.9 + Math.sin(t*1.3)*0.1;
  innerLight.intensity = 62 + Math.sin(t*1.3)*3;
  lanternLight.intensity = 5 + Math.sin(t*6)*0.8;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
