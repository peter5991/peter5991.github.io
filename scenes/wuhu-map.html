const MAP_THEME_PRIMARY = '#00e5b0';
const LEGACY_THEME_PRIMARY = '#9fc53a';

function normalizeHex(value) {
  const normalized = value.trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(normalized)) {
    return `#${normalized.split('').map((item) => item + item).join('').toLowerCase()}`;
  }
  if (!/^[0-9a-f]{6}$/i.test(normalized)) throw new Error(`Invalid map theme color: ${value}`);
  return `#${normalized.toLowerCase()}`;
}
function hexToRgb(value) {
  const hex = normalizeHex(value).slice(1);
  return {
    r: Number.parseInt(hex.slice(0, 2), 16),
    g: Number.parseInt(hex.slice(2, 4), 16),
    b: Number.parseInt(hex.slice(4, 6), 16),
  };
}
function rgbToHex({ r, g, b }) {
  const channel = (value) => Math.round(Math.max(0, Math.min(255, value))).toString(16).padStart(2, '0');
  return `#${channel(r)}${channel(g)}${channel(b)}`;
}
function rgbToHsl({ r, g, b }) {
  const red = r / 255, green = g / 255, blue = b / 255;
  const max = Math.max(red, green, blue), min = Math.min(red, green, blue);
  const delta = max - min;
  let hue = 0;
  if (delta !== 0) {
    if (max === red) hue = ((green - blue) / delta) % 6;
    else if (max === green) hue = (blue - red) / delta + 2;
    else hue = (red - green) / delta + 4;
    hue /= 6;
    if (hue < 0) hue += 1;
  }
  const lightness = (max + min) / 2;
  const saturation = delta === 0 ? 0 : delta / (1 - Math.abs(2 * lightness - 1));
  return { h: hue, s: saturation, l: lightness };
}
function hslToRgb({ h, s, l }) {
  const hue = ((h % 1) + 1) % 1;
  const chroma = (1 - Math.abs(2 * l - 1)) * s;
  const section = hue * 6;
  const x = chroma * (1 - Math.abs((section % 2) - 1));
  let red = 0, green = 0, blue = 0;
  if (section < 1) [red, green] = [chroma, x];
  else if (section < 2) [red, green] = [x, chroma];
  else if (section < 3) [green, blue] = [chroma, x];
  else if (section < 4) [green, blue] = [x, chroma];
  else if (section < 5) [red, blue] = [x, chroma];
  else [red, blue] = [chroma, x];
  const match = l - chroma / 2;
  return { r: (red + match) * 255, g: (green + match) * 255, b: (blue + match) * 255 };
}
function clamp(value) { return Math.max(0, Math.min(1, value)); }

function deriveLegacyThemeColor(legacyValue) {
  const source = normalizeHex(MAP_THEME_PRIMARY);
  const legacySource = normalizeHex(LEGACY_THEME_PRIMARY);
  const legacyRole = normalizeHex(legacyValue);
  if (source === legacySource) return legacyRole;
  const sourceHsl = rgbToHsl(hexToRgb(source));
  const legacySourceHsl = rgbToHsl(hexToRgb(legacySource));
  const roleHsl = rgbToHsl(hexToRgb(legacyRole));
  return rgbToHex(hslToRgb({
    h: roleHsl.h + sourceHsl.h - legacySourceHsl.h,
    s: clamp(roleHsl.s + sourceHsl.s - legacySourceHsl.s),
    l: clamp(roleHsl.l + sourceHsl.l - legacySourceHsl.l),
  }));
}
function themeRgba(legacyValue, alpha) {
  const { r, g, b } = hexToRgb(deriveLegacyThemeColor(legacyValue));
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ================= 地形材质(mapTerrainMaterial.ts 内联) ================= */
let terrainTextures;
let terrainTexturesReady;

function configureTexture(texture, isColorMap = false) {
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.8, 2.15);
  texture.offset.set(0.07, 0.11);
  texture.rotation = -0.08;
  texture.center.set(0.5, 0.5);
  texture.anisotropy = 8;
  if (isColorMap) texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
}

function getTerrainTextures() {
  if (!terrainTextures) {
    const loader = new THREE.TextureLoader();
    let resolveReady;
    let pendingTextures = 4;
    terrainTexturesReady = new Promise((resolve) => { resolveReady = resolve; });
    const markTextureReady = () => {
      pendingTextures -= 1;
      if (pendingTextures === 0 && terrainTextures && resolveReady) resolveReady(terrainTextures);
    };
    const loadTexture = (url, isColorMap = false) => configureTexture(
      loader.load(url, markTextureReady, undefined, markTextureReady),
      isColorMap,
    );
    terrainTextures = {
      diffuseMap: loadTexture('./wuhu-map/textures/terrain-diffuse.jpg', true),
      displacementMap: loadTexture('./wuhu-map/textures/terrain-height.jpg'),
      normalMap: loadTexture('./wuhu-map/textures/terrain-normal.jpg'),
      roughnessMap: loadTexture('./wuhu-map/textures/terrain-roughness.jpg'),
    };
  }
  return terrainTextures;
}
async function waitForTerrainTexturesReady() {
  const textures = getTerrainTextures();
  await terrainTexturesReady;
  return textures;
}
function createMapTerrainMaterial(config) {
  const textures = getTerrainTextures();
  const material = new THREE.MeshStandardMaterial({
    color: mapTheme.terrainColor,
    emissive: mapTheme.terrainEmissive,
    emissiveIntensity: 0.12,
    map: textures.diffuseMap,
    displacementMap: textures.displacementMap,
    displacementScale: config.elevationScale,
    normalMap: textures.normalMap,
    normalScale: new THREE.Vector2(config.normalStrength, config.normalStrength),
    roughnessMap: textures.roughnessMap,
    roughness: config.roughness,
    metalness: 0.03,
    transparent: true,
    opacity: config.textureOpacity,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  material.userData.terrainConfig = { ...config };
  return material;
}

/* ================= 地图数据(本地 GeoJSON,离线可用) ================= */
const geoJsonCache = new Map();
const pendingGeoJsonLoads = new Map();

async function loadMapLevel(scope, code) {
  const cacheKey = `${scope}:${code}`;
  const cached = geoJsonCache.get(cacheKey);
  if (cached) return cached;
  const pending = pendingGeoJsonLoads.get(cacheKey);
  if (pending) return pending;

  const url = scope === 'city'
    ? './wuhu-map/maps/wuhu.json'
    : `./wuhu-map/maps/wuhu/${code}.json`;
  const loadPromise = fetch(url)
    .then((response) => {
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    })
    .then((geoJson) => {
      geoJsonCache.set(cacheKey, geoJson);
      return geoJson;
    })
    .finally(() => pendingGeoJsonLoads.delete(cacheKey));
  pendingGeoJsonLoads.set(cacheKey, loadPromise);
  return loadPromise;
}
function prefetchMapLevel(scope, code) {
  const cacheKey = `${scope}:${code}`;
  if (geoJsonCache.has(cacheKey) || pendingGeoJsonLoads.has(cacheKey)) return;
  loadMapLevel(scope, code).catch(() => undefined);
}

            bounds.lonMax = Math.max(bounds.lonMax, lon);
            bounds.latMin = Math.min(bounds.latMin, lat);
            bounds.latMax = Math.max(bounds.latMax, lat);
          });
        });
      });
    });
    cityGeoBounds = bounds;
  }
  return cityGeoBounds;
}
function pointInRing([x, y], ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i, i += 1) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function isCoordInCurrentGeoData(coord) {
  return geoData.features.some((feature) =>
    toPolygons(feature).some((polygon) =>
      pointInRing(coord, polygon[0]) && !polygon.slice(1).some((hole) => pointInRing(coord, hole)),
    ),
  );
}
function relToGeoCoord(point) {
  const bounds = getCityGeoBounds();
  return [
    bounds.lonMin + point.x * (bounds.lonMax - bounds.lonMin),
    bounds.latMax - point.y * (bounds.latMax - bounds.latMin),
  ];
}
function clearStationMarkers() {
  if (stationGroup && mapGroup) {
    mapGroup.remove(stationGroup);
    disposeObject3D(stationGroup);
  }
  stationGroup = undefined;
  stationHitMeshes.length = 0;
  stationPulseRings.length = 0;
}
function createStationMarkers() {
  if (!mapGroup) return;
  clearStationMarkers();
  const group = new THREE.Group();
  const inCurrentBounds = (p) => {
    const [lon, lat] = relToGeoCoord(p);
    if (lon < lonMin || lon > lonMax || lat < latMin || lat > latMax) return false;
    return isCoordInCurrentGeoData([lon, lat]);
  };
  const addMarker = (p, isCenter = false) => {
    if (!inCurrentBounds(p)) return;
    const base = projectPoint(relToGeoCoord(p), 52);
    const color = isCenter
      ? stationStatusColors.normal
      : stationStatusColors[p.status] ?? stationStatusColors.normal;
    const radius = isCenter ? 13 : Math.max(4, (p.size ?? 8) * 0.62);
    const dot = new THREE.Mesh(
      new THREE.CircleGeometry(radius * 0.52, 24),
      new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.95,
        blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false,
      }),
    );
    dot.position.copy(base);
    dot.renderOrder = 18;
    dot.userData.station = p;
    stationHitMeshes.push(dot);
    group.add(dot);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(radius * 0.8, radius, 32),
      new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.7,
        blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
      }),
    );
    ring.position.copy(base);
    ring.renderOrder = 17;
    ring.userData.phase = Math.abs(base.x * 0.13 + base.y * 0.07) % 1;
    stationPulseRings.push(ring);
    group.add(ring);

    if (isCenter) {
      const outer = new THREE.Mesh(
        new THREE.RingGeometry(radius * 1.35, radius * 1.5, 40),
        new THREE.MeshBasicMaterial({
          color, transparent: true, opacity: 0.5,
          blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
        }),
      );
      outer.position.copy(base);
      outer.renderOrder = 17;
      group.add(outer);
    }
  };
  STATION_POINTS.forEach((p) => addMarker(p));
  if (CENTER_POINT) addMarker(CENTER_POINT, true);
  stationGroup = group;
  mapGroup.add(group);
}

/* ================= 高亮 ================= */
function setCityLabelSelected(featureName) {
  cityLabelElements.forEach((element, cityName) => {
    element.classList.toggle('is-selected', cityName === featureName);
  });
}
function setFeatureHighlight(featureName) {
  if (hoveredFeature === featureName) return;
  if (hoveredFeature) {
    featureLiftGroups.get(hoveredFeature)?.forEach((group) => {
      group.userData.targetZ = group.userData.baseZ ?? 0;
    });
    featureSideMaterials.get(hoveredFeature)?.forEach((material) => {
      material.uniforms.topColor.value.set(mapTheme.accent);
      material.uniforms.midColor.value.set(mapTheme.sideMid);
      material.uniforms.bottomColor.value.set(mapTheme.sideBottom);
      material.uniforms.alpha.value = 0;
    });
    featureHighlightMaterials.get(hoveredFeature)?.forEach((material) => {
      material.userData.targetOpacity = 0;
    });
    featureMeshes.get(hoveredFeature)?.forEach((mesh) => {
      const material = mesh.material;
      if (material instanceof THREE.MeshStandardMaterial) {
        material.color.set(material.userData.baseColor ?? mapTheme.surfaceBase);
        material.emissive.set(material.userData.baseEmissive ?? mapTheme.surfaceEmissive);
        material.emissiveIntensity = material.userData.baseEmissiveIntensity ?? 0.03;
        material.opacity = material.userData.baseOpacity ?? 0.86;
      }
    });
  }
  hoveredFeature = featureName;
  setCityLabelSelected(featureName);
  if (!featureName) return;
  featureLiftGroups.get(featureName)?.forEach((group) => { group.userData.targetZ = 16; });
  featureSideMaterials.get(featureName)?.forEach((material) => {
    material.uniforms.topColor.value.set(mapTheme.accent);
    material.uniforms.midColor.value.set(mapTheme.hoverMid);
    material.uniforms.bottomColor.value.set(mapTheme.hoverBottom);
    material.uniforms.alpha.value = 0.9;
  });
  featureHighlightMaterials.get(featureName)?.forEach((material) => {
    material.userData.targetOpacity = 0.32;
  });
  featureMeshes.get(featureName)?.forEach((mesh) => {
    const material = mesh.material;
    if (material instanceof THREE.MeshStandardMaterial) {
      material.userData.baseColor ??= `#${material.color.getHexString()}`;
      material.userData.baseEmissive ??= `#${material.emissive.getHexString()}`;
      material.userData.baseOpacity ??= material.opacity;
      material.userData.baseEmissiveIntensity ??= material.emissiveIntensity;
      material.color.set(mapTheme.accent);
      material.emissive.set(mapTheme.accent);
      material.emissiveIntensity = 0.72;
      material.opacity = 0.68;
    }
  });
}
function resetAllFeatureHighlights() {
  featureLiftGroups.forEach((groups) => {
    groups.forEach((group) => { group.userData.targetZ = group.userData.baseZ ?? 0; });
  });
  featureSideMaterials.forEach((materials) => {
    materials.forEach((material) => {
      material.uniforms.topColor.value.set(mapTheme.accent);
      material.uniforms.midColor.value.set(mapTheme.sideMid);
      material.uniforms.bottomColor.value.set(mapTheme.sideBottom);
      material.uniforms.alpha.value = 0;
    });
  });
  featureHighlightMaterials.forEach((materials) => {
    materials.forEach((material) => { material.userData.targetOpacity = 0; });
  });
  featureMeshes.forEach((meshes) => {
    meshes.forEach((mesh) => {
      const material = mesh.material;
      if (material instanceof THREE.MeshStandardMaterial) {
        material.color.set(material.userData.baseColor ?? mapTheme.surfaceBase);
        material.emissive.set(material.userData.baseEmissive ?? mapTheme.surfaceEmissive);
        material.emissiveIntensity = material.userData.baseEmissiveIntensity ?? 0.03;
        material.opacity = material.userData.baseOpacity ?? 0.86;
      }
    });
  });
  hoveredFeature = '';
  setCityLabelSelected('');
}

/* ================= 交互 ================= */
function hideTip() { tipEl.style.display = 'none'; }
function showTip(html, x, y) {
  tipEl.textContent = html;
  tipEl.style.display = 'block';
  const pad = 14;
  const rect = tipEl.getBoundingClientRect();
  let left = x + pad;
  let top = y - rect.height - pad;
  if (left + rect.width > innerWidth - 8) left = x - rect.width - pad;
  if (top < 8) top = y + pad;
  tipEl.style.left = `${left}px`;
  tipEl.style.top = `${top}px`;
}

function onPointerMove(event) {
  if (!camera || !renderer) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(interactiveMeshes, false)[0];
  const featureName = hit?.object.userData.featureName ?? '';
  setFeatureHighlight(featureName);
  if (featureName) prefetchDrillTarget(featureName);
}
function onPointerLeave() {
  resetAllFeatureHighlights();
  hideTip();
}
function resolveDrillTarget(feature) {
  if (currentState.scope !== 'city') return undefined; // 仅支持 市 → 区县
  const code = getFeatureCode(feature);
  if (!code) return undefined;
  return { scope: 'district', regionName: getFeatureName(feature), code };
}
function prefetchDrillTarget(featureName) {
  const feature = featureByName.get(featureName);
  if (!feature) return;
  const target = resolveDrillTarget(feature);
  if (!target) return;
  prefetchMapLevel(target.scope, target.code);
}
function onPointerDown(event) {
  if (!camera || !renderer) return;
  if (event.target instanceof HTMLElement && event.target.closest('.map-drill-control')) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  // 业务站点优先:点中站点显示信息浮层,不触发下钻
  const stationHit = raycaster.intersectObjects(stationHitMeshes, false)[0];
  if (stationHit?.object.userData.station) {
    const station = stationHit.object.userData.station;
    showTip(station.label ?? '', event.clientX, event.clientY);
    return;
  }
  hideTip();
  const hit = raycaster.intersectObjects(interactiveMeshes, false)[0];
  const featureName = hit?.object.userData.featureName;
  if (typeof featureName === 'string' && featureName) void drillToFeature(featureName);
}

/* ================= 下钻 ================= */
function refreshDrillControl() {
  if (!drillControlEl) return;
  const scopeLabel = { city: '市级', district: '区县' }[currentState.scope];
  const backDisabled = !drillStack.length || isDrilling ? 'disabled' : '';
  drillControlEl.innerHTML = `
    <button type="button" data-map-action="back" ${backDisabled}>返回上级</button>
    <span>${scopeLabel} / ${currentState.regionName}</span>
  `;
  drillControlEl.querySelectorAll('button').forEach((button) => {
    button.addEventListener('click', () => {
      if (button.dataset.mapAction === 'back') void drillBack();
    });
  });
}
function createDrillControl() {
  drillControlEl = document.createElement('div');
  drillControlEl.className = 'map-drill-control';
  host.appendChild(drillControlEl);
  refreshDrillControl();
}
async function warmInitialMapRenderer(group, buildVersion) {
  const warmupVersion = ++rendererWarmupVersion;
  const warmRenderer = renderer;
  const warmScene = scene;
  const warmCamera = camera;
  if (!warmRenderer || !warmScene || !warmCamera) return;
  const textures = await waitForTerrainTexturesReady();
  if (warmupVersion !== rendererWarmupVersion || buildVersion !== mapBuildVersion
    || mapGroup !== group || renderer !== warmRenderer) return;
  await waitForPreloadSlice();
  try {
    await warmRenderer.compileAsync(warmScene, warmCamera);
  } catch {
    // 编译失败时下方隐藏渲染兜底
  }
  for (const texture of Object.values(textures)) {
    if (warmupVersion !== rendererWarmupVersion || renderer !== warmRenderer) return;
    await waitForPreloadSlice();
    warmRenderer.initTexture(texture);
  }
  await waitForPreloadSlice();
  if (warmupVersion !== rendererWarmupVersion || buildVersion !== mapBuildVersion
    || mapGroup !== group || renderer !== warmRenderer) return;
  warmRenderer.render(warmScene, warmCamera);
  hasRenderedStaticFrame = true;
  loadingEl.classList.add('done');
}
async function rebuildMapForCurrentState() {
  if (!scene) return;
  const buildVersion = ++mapBuildVersion;
  const previousMapGroup = mapGroup;
  geoData = currentState.geoData;
  updateProjectionFromGeoData();
  currentLabels = createLabelsForState();
  resetAllFeatureHighlights();
  const nextMapGroup = await createMap();
  if (buildVersion !== mapBuildVersion || !scene) {
    disposeObject3D(nextMapGroup);
    return;
  }
  if (previousMapGroup) {
    scene.remove(previousMapGroup);
    disposeObject3D(previousMapGroup);
  }
  labelRenderer?.domElement.replaceChildren();
  if (labelRenderer?.domElement) labelRenderer.domElement.style.opacity = '0';
  mapGroup = nextMapGroup;
  nextMapGroup.userData.transitionStart = performance.now() / 1000;
  scene.add(nextMapGroup);
  createCityMarkers(mapGroup);
  createStationMarkers();
  resetAllFeatureHighlights();
  refreshDrillControl();
  if (!hasRenderedStaticFrame) void warmInitialMapRenderer(nextMapGroup, buildVersion);
}
async function drillToFeature(featureName) {
  if (isDrilling) return;
  const feature = featureByName.get(featureName);
  if (!feature) return;
  const target = resolveDrillTarget(feature);
  if (!target) return;
  isDrilling = true;
  refreshDrillControl();
  try {
    const nextGeoJson = await loadMapLevel(target.scope, target.code);
    drillStack = [...drillStack, { state: currentState, cameraView: getCurrentCameraView() }];
    currentState = {
      scope: target.scope,
      regionName: target.regionName,
      code: target.code,
      geoData: nextGeoJson,
    };
    await waitForNextFrame();
    await rebuildMapForCurrentState();
  } catch (error) {
    console.warn('Map drilldown failed', error);
  } finally {
    isDrilling = false;
    refreshDrillControl();
  }
}
async function drillBack() {
  if (isDrilling) return;
  const previousItem = drillStack[drillStack.length - 1];
  if (!previousItem) return;
  const nextStack = drillStack.slice(0, -1);
  const currentBeforeBack = currentState;
  const stackBeforeBack = drillStack;
  isDrilling = true;
  drillStack = nextStack;
  currentState = previousItem.state;
  refreshDrillControl();
  try {
    await waitForNextFrame();
    await rebuildMapForCurrentState();
    if (previousItem.cameraView) applyCameraView(previousItem.cameraView);
  } catch (error) {
    console.warn('Map drillback failed', error);
    drillStack = stackBeforeBack;
    currentState = currentBeforeBack;
    await rebuildMapForCurrentState();
  } finally {
    isDrilling = false;
    refreshDrillControl();
  }
}

/* ================= 初始化 / 渲染循环 ================= */
function getHostSize() {
  const width = Math.max(1, Math.round(host.clientWidth || innerWidth));
  const height = Math.max(1, Math.round(host.clientHeight || innerHeight));
  return { width, height };
}
function setup() {
  const { width, height } = getHostSize();
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(cameraViewConfig.default.fov, width / height, 1, 2400);
  camera.position.set(...cameraViewConfig.default.position);
  camera.lookAt(...cameraViewConfig.default.target);

  renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true,
    failIfMajorPerformanceCaveat: false,
    powerPreference: 'high-performance',
  });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  host.appendChild(renderer.domElement);
  host.addEventListener('pointermove', onPointerMove);
  host.addEventListener('pointerdown', onPointerDown);
  host.addEventListener('pointerleave', onPointerLeave);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 520;
  controls.maxDistance = 1450;
  controls.target.set(...cameraViewConfig.default.target);
  controls.addEventListener('change', updateCityLabelPresentation);
  controls.addEventListener('start', () => { hasUserAdjustedCamera = true; });
  applyCameraView(resolveBuiltInCameraView(currentState.scope));
  updateCityLabelPresentation();

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(width, height);
  labelRenderer.domElement.className = 'map-label-layer';
  host.appendChild(labelRenderer.domElement);
  createDrillControl();

  scene.add(new THREE.AmbientLight(mapTheme.ambientLight, 1.45));
  const light = new THREE.DirectionalLight(mapTheme.directionalLight, 2.4);
  light.position.set(120, -240, 420);
  scene.add(light);

  void rebuildMapForCurrentState();
  startMapAnimation();
}
function startMapAnimation() {
  if (raf) return;
  raf = requestAnimationFrame(animate);
}
function animate() {
  raf = 0;
  const t = performance.now() / 1000;
  if (mapGroup) {
    applyGroupTransition(mapGroup, t);
    if (!mapGroup.userData.transitionStart) {
      const basePosition = mapGroup.userData.basePosition;
      if (basePosition) {
        mapGroup.position.x = basePosition.x;
        mapGroup.position.y = basePosition.y;
        mapGroup.position.z = basePosition.z + Math.sin(t * 0.55) * 2;
      }
    }
  }
  if (ringDecorGroup) ringDecorGroup.rotation.z += 0.004;
  updateProvinceChaseLight(t);
  stationPulseRings.forEach((ring) => {
    const phase = (t * 0.5 + ring.userData.phase) % 1;
    ring.scale.setScalar(1 + phase * 1.6);
    const material = ring.material;
    material.opacity = 0.75 * (1 - phase);
  });
  flyLineMaterials.forEach((material) => { material.uniforms.uTime.value = t; });
  featureLiftGroups.forEach((groups) => {
    groups.forEach((group) => {
      group.position.z += ((group.userData.targetZ ?? 0) - group.position.z) * 0.16;
    });
  });
  featureHighlightMaterials.forEach((materials) => {
    materials.forEach((material) => {
      material.opacity += ((material.userData.targetOpacity ?? 0) - material.opacity) * 0.18;
    });
  });
  if (scene && camera) {
    controls?.update();
    updateCityLabelPresentation();
    renderer?.render(scene, camera);
    labelRenderer?.render(scene, camera);
  }
  raf = requestAnimationFrame(animate);
}
function resize() {
  if (!camera || !renderer || !labelRenderer) return;
  const { width, height } = getHostSize();
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  labelRenderer.setSize(width, height);
  updateCityLabelPresentation();
  if (!hasUserAdjustedCamera) {
    applyCameraView(resolveBuiltInCameraView(currentState.scope));
  }
}

/* ================= 启动 ================= */
(async function boot() {
  try {
    const wuhuGeoJson = await loadMapLevel('city', '340200');
    currentState = { scope: 'city', regionName: '芜湖市', code: '340200', geoData: wuhuGeoJson };
    geoData = wuhuGeoJson;
    setup();
    window.addEventListener('resize', resize);
    if ('ResizeObserver' in window) {
      resizeObserver = new ResizeObserver(() => resize());
      resizeObserver.observe(host);
    }
  } catch (error) {
    console.error('Wuhu map init failed', error);
    loadingEl.classList.add('error');
    loadingEl.textContent = `地图数据加载失败:${error?.message ?? error}`;
  }
})();
</script>
